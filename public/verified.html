<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04120c">
<title>Email Verified</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#04120c;color:#fff;
    min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(circle at 30% 20%,rgba(16,185,129,0.15),transparent 55%),#04120c}
  .card{max-width:400px;text-align:center;padding:40px 28px;border-radius:22px;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09)}
  .ico{width:88px;height:88px;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;
    background:linear-gradient(135deg,#34d399,#10b981);color:#04120c;
    box-shadow:0 20px 50px -10px rgba(52,211,153,0.6)}
  h1{font-size:26px;font-weight:800;margin-bottom:12px}
  p{font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6}
  a{display:inline-block;margin-top:24px;padding:13px 26px;border-radius:12px;
    background:linear-gradient(135deg,#34d399,#10b981,#fbbf24);color:#04120c;
    font-weight:700;text-decoration:none;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="ico">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Email verified!</h1>
    <p>Your email has been confirmed. Your registration is complete once the admin verifies your bKash payment.</p>
    <a href="/">Back to site</a>
  </div>
</body>
</html>
