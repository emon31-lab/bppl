<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04120c">
<title>Home · Football Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#10b981;--accent-lt:#34d399;--gold:#fbbf24;
  --text:#fff;--text-dim:rgba(255,255,255,0.7);--text-mute:rgba(255,255,255,0.42);
  --border:rgba(255,255,255,0.09);
}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#04120c;color:#fff;
min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
background:radial-gradient(circle at 20% 0%,rgba(16,185,129,0.15),transparent 55%),
radial-gradient(circle at 80% 100%,rgba(251,191,36,0.10),transparent 55%),
linear-gradient(180deg,#061a12 0%,#04120c 50%,#030a07 100%);
display:flex;justify-content:center}
.app{width:100%;max-width:460px;padding:32px 22px 40px;display:flex;flex-direction:column;
min-height:100dvh;position:relative}
.hero{text-align:center;padding:40px 0 32px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;
background:rgba(52,211,153,0.10);border:1px solid rgba(52,211,153,0.24);
color:var(--accent-lt);font-size:10.5px;font-weight:700;letter-spacing:1.4px;
text-transform:uppercase;margin-bottom:18px}
.logo{width:88px;height:88px;margin:0 auto 20px;border-radius:24px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--accent-lt),var(--accent));
color:#04120c;box-shadow:0 20px 50px -10px rgba(52,211,153,0.6),
  0 0 60px rgba(52,211,153,0.25);animation:bounce 3s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo svg{width:46px;height:46px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.hero h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-0.02em;margin-bottom:8px;
background:linear-gradient(135deg,#fff 0%,#a7f3d0 60%,#fcd34d 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:14px;color:var(--text-dim);line-height:1.55}

.cards{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.card{display:flex;align-items:center;gap:18px;padding:22px 20px;border-radius:18px;
background:linear-gradient(145deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));
border:1px solid var(--border);text-decoration:none;color:inherit;
transition:all 0.3s cubic-bezier(0.32,0.72,0,1);position:relative;overflow:hidden;
animation:fadeUp 0.6s ease both}
.card:hover{border-color:rgba(255,255,255,0.18);transform:translateY(-2px);
background:rgba(255,255,255,0.07);box-shadow:0 12px 28px -10px rgba(0,0,0,0.5)}
.card:active{transform:translateY(0) scale(0.98)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card-icon{width:52px;height:52px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;
transition:transform 0.3s ease}
.card:hover .card-icon{transform:scale(1.08)}
.card-icon svg{width:26px;height:26px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.card-fillup .card-icon{background:linear-gradient(135deg,rgba(52,211,153,0.25),rgba(16,185,129,0.10));
border:1px solid rgba(52,211,153,0.4);color:var(--accent-lt);
box-shadow:0 8px 20px -6px rgba(52,211,153,0.4)}
.card-admin .card-icon{background:linear-gradient(135deg,rgba(251,191,36,0.20),rgba(251,191,36,0.06));
border:1px solid rgba(251,191,36,0.4);color:var(--gold)}
.card-body{flex:1;min-width:0}
.card-title{font-size:16px;font-weight:700;letter-spacing:-0.01em;margin-bottom:3px}
.card-desc{font-size:12px;color:var(--text-mute);line-height:1.4}
.card-arrow{width:24px;height:24px;color:var(--text-mute);flex-shrink:0;
transition:all 0.3s ease}
.card:hover .card-arrow{color:var(--accent-lt);transform:translateX(3px)}
.card-arrow svg{width:100%;height:100%;stroke-width:2.5;fill:none;stroke:currentColor;
stroke-linecap:round;stroke-linejoin:round}

.footer{margin-top:auto;padding-top:32px;text-align:center;font-size:11px;
color:var(--text-mute);line-height:1.6}
.footer .brand{color:var(--accent-lt);font-weight:700}

@media (max-width:380px){
  .hero h1{font-size:24px}
  .logo{width:74px;height:74px}
  .logo svg{width:38px;height:38px}
}
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="logo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2l3.5 3.5L12 9 8.5 5.5 12 2zM2 12l3.5-3.5L9 12l-3.5 3.5L2 12zM22 12l-3.5 3.5L15 12l3.5-3.5L22 12zM12 22l-3.5-3.5L12 15l3.5 3.5L12 22z"/></svg>
    </div>
    <span class="badge" id="badge">Registration Open</span>
    <h1 id="title">Football Tournament</h1>
    <p id="subtitle">Register your slot or manage entries from admin panel.</p>
  </div>

  <div class="cards">
    <a href="/fillup" class="card card-fillup" style="animation-delay:.1s">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Fill-up Form</div>
        <div class="card-desc">Register as a player · solo entry</div>
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <a href="/admin" class="card card-admin" style="animation-delay:.2s">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Admin Login</div>
        <div class="card-desc">Manage registrations · approve players</div>
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>
  </div>

  <div class="footer">
    <span class="brand" id="brand">Football Tournament</span><br>
    Powered by solo registration
  </div>

</div>

<script>
(async function(){
  try {
    const r = await fetch('/api/config');
    const c = await r.json();
    document.getElementById('title').textContent = c.tournamentName;
    document.getElementById('brand').textContent = c.tournamentName;
    document.title = 'Home · ' + c.tournamentName;
  } catch(e) {}
})();
</script>
</body>
</html>
